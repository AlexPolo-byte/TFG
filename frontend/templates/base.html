<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex IA &bull; Asistente Tecnológico Adaptativo</title>

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Chart.js & Vanilla Tilt for gentle 3D cards -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>

    <style>
        :root {
            /* Palette: Modern Light AI (Clean, Friendly & Accessible) */
            --bg-canvas: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-solid: #ffffff;
            --bg-surface-soft: #f1f5f9;
            --bg-sidebar: rgba(255, 255, 255, 0.92);
            
            --primary: #4f46e5;          /* Modern Indigo */
            --primary-light: #6366f1;
            --primary-soft: #eef2ff;
            --primary-glow: rgba(79, 70, 229, 0.15);
            
            --secondary: #06b6d4;        /* Fresh Cyan */
            --accent: #8b5cf6;           /* Violet */
            --success: #10b981;          /* Friendly Emerald */
            --success-soft: #ecfdf5;
            --warning: #f59e0b;          /* Soft Amber */
            --warning-soft: #fffbeb;
            --danger: #ef4444;           /* Coral Rose */
            --danger-soft: #fef2f2;
            
            --text-title: #0f172a;       /* Dark Slate */
            --text-body: #334155;        /* Medium Slate */
            --text-muted: #64748b;       /* Soft Gray */
            --text-dim: #94a3b8;         /* Light Gray */
            
            --border-glass: rgba(226, 232, 240, 0.8);
            --border-glass-bright: #ffffff;
            --border-card: #e2e8f0;
            
            --radius-xs: 8px;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-pill: 9999px;
            
            --shadow-subtle: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
            --shadow-card: 0 10px 25px -4px rgba(15, 23, 42, 0.05), 0 4px 10px -2px rgba(15, 23, 42, 0.02);
            --shadow-card-hover: 0 20px 35px -6px rgba(15, 23, 42, 0.08), 0 8px 16px -4px rgba(15, 23, 42, 0.04);
            --shadow-primary: 0 8px 20px -3px rgba(79, 70, 229, 0.25);
            
            --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-body);
            height: 100vh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Pastel Lighting */
        .ambient-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.55;
            animation: orbFloat 22s ease-in-out infinite alternate;
        }

        .ambient-orb-1 {
            width: 600px;
            height: 600px;
            top: -12%;
            left: 15%;
            background: radial-gradient(circle, #e0e7ff 0%, #e0f2fe 60%, transparent 80%);
        }

        .ambient-orb-2 {
            width: 650px;
            height: 650px;
            bottom: -15%;
            right: 10%;
            background: radial-gradient(circle, #fae8ff 0%, #f3e8ff 60%, transparent 80%);
            animation-duration: 26s;
            animation-delay: -5s;
        }

        .ambient-orb-3 {
            width: 450px;
            height: 450px;
            top: 40%;
            right: 35%;
            background: radial-gradient(circle, #fef3c7 0%, transparent 70%);
            opacity: 0.35;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 20px) scale(1.05); }
            100% { transform: translate(-25px, -15px) scale(0.95); }
        }

        /* Ambient Canvas for subtle micro-particles */
        #ambient-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            opacity: 0.6;
        }

        /* Clean White Frosted Sidebar */
        .app-nav {
            width: 275px;
            background: var(--bg-sidebar);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            padding: 28px 20px;
            z-index: 100;
            flex-shrink: 0;
            position: relative;
            box-shadow: 4px 0 24px rgba(15, 23, 42, 0.03);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 34px;
            padding: 0 6px;
            text-decoration: none;
        }

        .brand-icon-box {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            color: #ffffff;
            box-shadow: 0 8px 18px -3px rgba(79, 70, 229, 0.35);
            transition: var(--transition-smooth);
        }

        .nav-brand:hover .brand-icon-box {
            transform: scale(1.06) rotate(3deg);
            box-shadow: 0 12px 24px -3px rgba(79, 70, 229, 0.45);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: var(--text-title);
        }

        .brand-badge {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 1px;
            font-weight: 500;
        }

        .nav-section-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-dim);
            margin: 0 12px 10px 12px;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.92rem;
            border: 1px solid transparent;
            transition: var(--transition-smooth);
        }

        .nav-item a i {
            font-size: 1.15rem;
            color: var(--text-dim);
            transition: var(--transition-smooth);
        }

        .nav-item a:hover {
            color: var(--text-title);
            background: rgba(241, 245, 249, 0.85);
            transform: translateX(3px);
        }

        .nav-item a:hover i {
            color: var(--primary);
        }

        .nav-item a.active {
            color: var(--primary);
            background: var(--primary-soft);
            border-color: rgba(79, 70, 229, 0.15);
            font-weight: 700;
        }

        .nav-item a.active i {
            color: var(--primary);
        }

        /* Sidebar Bottom Hardware Card */
        .nav-footer {
            border-top: 1px solid var(--border-glass);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hw-status-card {
            background: #ffffff;
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            padding: 11px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-subtle);
        }

        .hw-status-info {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 0.8rem;
            color: var(--text-title);
            font-weight: 600;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            position: relative;
        }

        .live-dot.pulse::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: var(--success);
            border-radius: 50%;
            animation: pulseWave 2s infinite;
        }

        @keyframes pulseWave {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }

        .btn-logout {
            text-decoration: none;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            transition: var(--transition-smooth);
        }

        .btn-logout:hover {
            color: var(--danger);
            background: var(--danger-soft);
        }

        /* Main Workspace Container */
        .app-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 34px 44px;
            padding-bottom: 90px;
            -webkit-overflow-scrolling: touch;
        }

        /* Elegant Modern Scrollbar */
        .content-scroll::-webkit-scrollbar { width: 7px; }
        .content-scroll::-webkit-scrollbar-track { background: transparent; }
        .content-scroll::-webkit-scrollbar-thumb { 
            background: #cbd5e1; 
            border-radius: var(--radius-pill); 
        }
        .content-scroll::-webkit-scrollbar-thumb:hover { 
            background: #94a3b8; 
        }

        /* Clean Glass Cards */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-card);
            transition: var(--transition-smooth);
            position: relative;
        }

        .glass-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-card-hover);
        }

        /* Clean Friendly Pills */
        .friendly-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            font-size: 0.76rem;
            font-weight: 600;
            background: var(--bg-surface-soft);
            color: var(--text-muted);
            border: 1px solid var(--border-card);
            transition: var(--transition-smooth);
        }

        .friendly-pill-primary {
            background: var(--primary-soft);
            color: var(--primary);
            border-color: rgba(79, 70, 229, 0.2);
        }

        .friendly-pill-success {
            background: var(--success-soft);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.2);
        }

        .friendly-pill-warning {
            background: var(--warning-soft);
            color: #d97706;
            border-color: rgba(245, 158, 11, 0.2);
        }

        .friendly-pill-danger {
            background: var(--danger-soft);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        /* Buttons */
        .btn-clean {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition-smooth);
        }

        .btn-clean-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: #ffffff;
            box-shadow: var(--shadow-primary);
        }

        .btn-clean-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -3px rgba(79, 70, 229, 0.35);
            color: #ffffff;
        }

        .btn-clean-outline {
            background: #ffffff;
            color: var(--text-title);
            border-color: var(--border-card);
        }

        .btn-clean-outline:hover {
            background: var(--bg-surface-soft);
            border-color: #cbd5e1;
        }

        /* Entrance Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            .app-nav {
                width: 100%;
                height: 70px;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 10px 20px;
                border-right: none;
                border-bottom: 1px solid var(--border-glass);
            }
            .nav-section-label, .nav-footer, .brand-badge { display: none; }
            .nav-brand { margin-bottom: 0; }
            .nav-list { flex-direction: row; gap: 6px; flex: initial; }
            .nav-item a { padding: 8px 12px; font-size: 0.82rem; }
            .content-scroll { padding: 20px; }
        }
    </style>
</head>

<body>
    <!-- Ambient Pastel Lighting Layers -->
    <div class="ambient-mesh">
        <div class="ambient-orb ambient-orb-1"></div>
        <div class="ambient-orb ambient-orb-2"></div>
        <div class="ambient-orb ambient-orb-3"></div>
    </div>

    <!-- Micro-particles Canvas -->
    <canvas id="ambient-canvas"></canvas>

    <!-- Sidebar Navigation -->
    <nav class="app-nav">
        <a href="{{ url_for('web.index') }}" class="nav-brand">
            <div class="brand-icon-box">
                <i class="bi bi-chat-heart-fill"></i>
            </div>
            <div class="brand-text">
                <span class="brand-title">Alex IA</span>
                <span class="brand-badge">
                    <span class="live-dot pulse"></span>
                    <span>Asistente Adaptativo</span>
                </span>
            </div>
        </a>

        <div class="nav-section-label">Supervisión</div>
        <ul class="nav-list">
            <li class="nav-item">
                <a href="{{ url_for('web.index') }}" class="{{ 'active' if request.path == '/' else '' }}">
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span>Panel General</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('web.public_terminal') }}" class="{{ 'active' if request.path == '/chat' else '' }}">
                    <i class="bi bi-chat-dots-fill"></i>
                    <span>Probar Asistente</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('web.users_list') }}" class="{{ 'active' if request.path.startswith('/user') else '' }}">
                    <i class="bi bi-people-fill"></i>
                    <span>Personas</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('web.errors_list') }}" class="{{ 'active' if request.path == '/errors' else '' }}">
                    <i class="bi bi-shield-check"></i>
                    <span>Incidencias</span>
                </a>
            </li>
        </ul>

        <div class="nav-footer">
            <div class="hw-status-card">
                <div class="hw-status-info">
                    <span class="live-dot pulse"></span>
                    <span>Raspberry Pi 5</span>
                </div>
                <span class="friendly-pill friendly-pill-success" style="font-size: 0.7rem;">EN LÍNEA</span>
            </div>
            <a href="{{ url_for('web.logout') }}" class="btn-logout">
                <i class="bi bi-box-arrow-right"></i>
                <span>Cerrar Sesión</span>
            </a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="app-content">
        <div class="content-scroll">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Clean Toast Notifications Container -->
    <div id="toast-container" style="position: fixed; bottom: 28px; right: 28px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Micro-particles Canvas
        const canvas = document.getElementById('ambient-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        const particleCount = 28;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.25,
                vy: (Math.random() - 0.5) * 0.25,
                radius: Math.random() * 2 + 1,
                color: Math.random() > 0.5 ? 'rgba(99, 102, 241,' : 'rgba(6, 182, 212,'
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particleCount; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color + ' 0.35)';
                ctx.fill();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Friendly Toast Notification
        window.showToast = function(title, message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.style.cssText = `
                pointer-events: auto;
                min-width: 270px;
                max-width: 360px;
                background: #ffffff;
                border: 1px solid var(--border-card);
                border-radius: var(--radius-md);
                padding: 14px 18px;
                box-shadow: 0 16px 32px rgba(15, 23, 42, 0.1);
                display: flex;
                align-items: center;
                gap: 12px;
                animation: fadeIn 0.3s ease forwards;
                transition: opacity 0.3s ease, transform 0.3s ease;
            `;

            let iconHtml = '<i class="bi bi-info-circle-fill" style="color:var(--primary); font-size:1.25rem;"></i>';
            if (type === 'success') {
                iconHtml = '<i class="bi bi-check-circle-fill" style="color:var(--success); font-size:1.25rem;"></i>';
            } else if (type === 'warning') {
                iconHtml = '<i class="bi bi-exclamation-triangle-fill" style="color:var(--warning); font-size:1.25rem;"></i>';
            } else if (type === 'error') {
                iconHtml = '<i class="bi bi-x-circle-fill" style="color:var(--danger); font-size:1.25rem;"></i>';
            }

            toast.innerHTML = `
                ${iconHtml}
                <div style="flex: 1;">
                    <div style="font-weight: 700; font-size: 0.88rem; color: var(--text-title);">${title}</div>
                    <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;">${message}</div>
                </div>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(8px)';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        };
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
