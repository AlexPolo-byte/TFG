<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFG System</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #0A84FF; /* Apple Blue Dark Mode */
            --primary-glow: rgba(10, 132, 255, 0.4);
            --bg-body: #050505;
            --bg-surface: rgba(28, 28, 30, 0.6); /* Translucent surface */
            --bg-surface-hover: rgba(44, 44, 46, 0.8);
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --border: rgba(255, 255, 255, 0.1);
            --radius: 20px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(10, 132, 255, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(48, 209, 88, 0.1), transparent 25%);
        }

        /* Glassmorphism Sidebar */
        .app-nav {
            width: 260px;
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            z-index: 100;
            flex-shrink: 0;
        }

        .nav-brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-item a:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transform: translateX(4px);
        }

        .nav-item a.active {
            background-color: rgba(10, 132, 255, 0.15);
            color: var(--primary);
            box-shadow: inset 2px 0 0 var(--primary);
        }

        .nav-footer {
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .app-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            padding-bottom: 100px;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Custom Scrollbar */
        .content-scroll::-webkit-scrollbar { width: 6px; }
        .content-scroll::-webkit-scrollbar-track { background: transparent; }
        .content-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .content-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .app-nav {
                position: fixed; bottom: 0; left: 0; right: 0; width: 100%; height: auto;
                padding: 10px 20px; border-right: none; border-top: 1px solid var(--border);
                flex-direction: row; background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(20px);
            }
            .nav-brand, .nav-text-desktop, .nav-footer { display: none; }
            .nav-list { flex-direction: row; justify-content: space-between; width: 100%; margin: 0; }
            .nav-item a { flex-direction: column; padding: 6px; gap: 4px; font-size: 0.7rem; }
            .content-scroll { padding: 20px; }
        }

        /* Glassmorphism Cards */
        .card-std {
            background: var(--bg-surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: var(--transition);
        }

        .card-std:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Badges */
        .badge-soft {
            padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 600;
        }
    </style>
</head>

<body>
    <nav class="app-nav">
        <div class="nav-brand"><i class="bi bi-cpu-fill" style="color: var(--primary)"></i> TFG System</div>
        <ul class="nav-list">
            <li class="nav-item"><a href="{{ url_for('web.index') }}"
                    class="{{ 'active' if request.path == '/' else '' }}"><i class="bi bi-speedometer2"></i> <span
                        class="nav-text-desktop">Dashboard</span></a></li>
            <li class="nav-item"><a href="{{ url_for('web.users_list') }}"
                    class="{{ 'active' if request.path == '/users' else '' }}"><i class="bi bi-people"></i> <span
                        class="nav-text-desktop">Usuarios</span></a></li>
            <li class="nav-item"><a href="{{ url_for('web.errors_list') }}"
                    class="{{ 'active' if request.path == '/errors' else '' }}"><i
                        class="bi bi-exclamation-triangle"></i> <span class="nav-text-desktop">Errores</span></a></li>
        </ul>
        <div class="nav-footer">
            <a href="{{ url_for('web.logout') }}"
                style="text-decoration: none; color: #FF3B30; display: flex; align-items: center; gap: 10px; font-weight: 500;"><i
                    class="bi bi-box-arrow-right"></i> Salir</a>
        </div>
    </nav>
    <main class="app-content">
        <div class="content-scroll">{% block content %}{% endblock %}</div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
