<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso al Panel &bull; Alex IA</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-canvas: #f8fafc;
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --primary-soft: #eef2ff;
            --text-title: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --border-card: #e2e8f0;
            --radius-md: 18px;
            --radius-lg: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-canvas);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-body);
            overflow: hidden;
            position: relative;
        }

        /* Ambient Lighting */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            pointer-events: none;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            top: -10%;
            left: 20%;
            background: radial-gradient(circle, #e0e7ff 0%, #e0f2fe 70%, transparent 80%);
        }

        .orb-2 {
            width: 550px;
            height: 550px;
            bottom: -15%;
            right: 15%;
            background: radial-gradient(circle, #fae8ff 0%, #f3e8ff 70%, transparent 80%);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 44px 38px;
            width: 90%;
            max-width: 420px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: #ffffff;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            margin: 0 auto 20px;
            box-shadow: 0 10px 22px -4px rgba(79, 70, 229, 0.35);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
            color: var(--text-title);
        }

        p {
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-title);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            border: 1px solid var(--border-card);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            background: #ffffff;
            color: var(--text-title);
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 14px;
            box-shadow: 0 8px 20px -3px rgba(79, 70, 229, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px -3px rgba(79, 70, 229, 0.4);
        }

        .alert-error {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.86rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid #fecaca;
        }

        .system-pill {
            margin-top: 28px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            background: #ffffff;
            border: 1px solid var(--border-card);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>

<body>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="login-card">
        <div class="icon-box">
            <i class="bi bi-chat-heart-fill"></i>
        </div>
        <h1>Alex IA</h1>
        <p>Panel de Supervisión del Asistente</p>

        {% if error %}
        <div class="alert-error">
            <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label><i class="bi bi-person"></i> Usuario</label>
                <div class="input-wrapper">
                    <i class="bi bi-person"></i>
                    <input type="text" name="username" placeholder="admin" required autofocus autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label><i class="bi bi-lock"></i> Contraseña</label>
                <div class="input-wrapper">
                    <i class="bi bi-key"></i>
                    <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit">
                <span>Acceder al Panel</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="system-pill">
            <span class="status-dot"></span>
            <span>Raspberry Pi 5 &bull; En Línea</span>
        </div>
    </div>
</body>

</html>
