{% extends 'base.html' %}

{% block content %}
<div class="page-header" style="margin-bottom: 24px;">
    <div style="display: flex; align-items: center; gap: 10px;">
        <a href="/user/{{ chat_id }}" style="color: var(--text-main);"><i class="bi bi-arrow-left"></i></a>
        <div>
            <h1 class="page-title" style="font-size: 1.2rem; font-weight: 700; margin: 0;">Galería de {{ name }}</h1>
            <p class="page-subtitle" style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">ID: {{ chat_id }}</p>
        </div>
    </div>
</div>

<div style="background: rgba(28, 28, 30, 0.6); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); padding: 20px; min-height: calc(100vh - 160px);">
    
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px;">
        {% for img in images %}
            <div class="fade-in" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;">
                <div style="width: 100%; aspect-ratio: 1; overflow: hidden; background: #000;">
                    <img src="data:image/jpeg;base64,{{ img.image_data }}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'" />
                </div>
                <div style="padding: 12px;">
                    <div style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 6px;"><i class="bi bi-clock"></i> {{ img.message.date | human_time }}</div>
                    <div style="font-size: 0.8rem; color: var(--text-main); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                        {{ img.ai_response }}
                    </div>
                </div>
            </div>
        {% else %}
            <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); margin-top: 40px; padding: 40px;">
                <i class="bi bi-images" style="font-size: 3rem; opacity: 0.5; margin-bottom: 10px; display: block;"></i>
                No hay fotos analizadas para este usuario.
            </div>
        {% endfor %}
    </div>

</div>
{% endblock %}
