version: '3.8'

services:
  # === TÚNEL PÚBLICO (ngrok) ===
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok_tunnel
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    ports:
      - "4040:4040"  # Web UI de ngrok
    networks:
      - tfg_network

  # ----------------------------------------------------
  # 1.5 PROXY INVERSO (Nginx)
  # ----------------------------------------------------
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080" # Expuesto localmente
    networks:
      - tfg_network


  # ----------------------------------------------------
  # 2. BACKEND (Recibe mensajes y los manda a la nube)
  # ----------------------------------------------------
  backend_telegram:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend_telegram
    restart: unless-stopped
    env_file: .env  # Lee las variables del archivo .env automáticamente
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLASK_EXPORTER_PORT=9091
      - TZ=Europe/Madrid
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis
    networks:
      - tfg_network

  # ----------------------------------------------------
  # 3. WORKER (Lee de la nube y procesa)
  # ----------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: worker
    restart: unless-stopped
    env_file: .env
    command: python worker.py
    environment:
      - WORKER_EXPORTER_PORT=9092
      - TZ=Europe/Madrid
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f worker.py || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis
    networks:
      - tfg_network

  # ----------------------------------------------------
  # 4. RABBITMQ (Cola de mensajes asíncrona)
  # ----------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"    # Puerto de comunicación
      - "15672:15672"  # Panel de administración web
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - tfg_network

  # ----------------------------------------------------
  # 5. REDIS (Caché para respuestas IA)
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - tfg_network

  # ----------------------------------------------------
  # 5. MONITORIZACIÓN (Logs y Métricas)
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - tfg_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - tfg_network

  # ----------------------------------------------------
  # 5. SISTEMA DE LOGS (Loki + Promtail)
  # ----------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - tfg_network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    volumes:
      # Le damos acceso al socket de Docker para que pueda "espiar" a los otros
      - /var/run/docker.sock:/var/run/docker.sock
      # Montamos el archivo de config que acabas de crear
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - tfg_network

networks:
  tfg_network:
    driver: bridge
volumes:
  grafana_data:
