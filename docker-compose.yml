version: '3.8'

services:
  # ----------------------------------------------------
  # 1. TÚNEL CLOUDFLARE (Tu IP Pública Gratis y Segura)
  # ----------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: unless-stopped
    # Esto expone el servicio 'backend_telegram' puerto 5000 a internet
    command: tunnel --url http://backend_telegram:5000
    networks:
      - tfg_network

  # ----------------------------------------------------
  # 2. BACKEND (Recibe mensajes y los manda a la nube)
  # ----------------------------------------------------
  backend_telegram:
    build: ./backend
    container_name: backend_telegram
    restart: always
    env_file: .env  # Lee las variables del archivo .env automáticamente
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLASK_EXPORTER_PORT=9091
      - TZ=Europe/Madrid
    networks:
      - tfg_network

  # ----------------------------------------------------
  # 3. WORKER (Lee de la nube y procesa)
  # ----------------------------------------------------
  worker:
    build: ./backend
    container_name: worker
    restart: always
    env_file: .env
    command: python worker.py
    environment:
      - WORKER_EXPORTER_PORT=9092
      - TZ=Europe/Madrid
    networks:
      - tfg_network

  # ----------------------------------------------------
  # 4. MONITORIZACIÓN (Logs y Métricas)
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - tfg_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - tfg_network

  # ----------------------------------------------------
  # 5. SISTEMA DE LOGS (Loki + Promtail)
  # ----------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - tfg_network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    volumes:
      # Le damos acceso al socket de Docker para que pueda "espiar" a los otros
      - /var/run/docker.sock:/var/run/docker.sock
      # Montamos el archivo de config que acabas de crear
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - tfg_network

networks:
  tfg_network:
    driver: bridge
volumes:
  grafana_data:
