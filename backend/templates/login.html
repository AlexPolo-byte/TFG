<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso Seguro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        :root { --primary: #007AFF; --bg: #F2F2F7; --text: #1C1C1E; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--text); }
        .login-card { background: white; padding: 40px; width: 90%; max-width: 400px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); text-align: center; }
        .icon-circle { width: 60px; height: 60px; background: #E4F2FF; color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 20px; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 5px; }
        p { color: #8E8E93; font-size: 0.9rem; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: #8E8E93; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 14px; border: 1px solid #E5E5EA; border-radius: 12px; font-size: 1rem; outline: none; background: #FAFAFA; transition: 0.2s; }
        input:focus { background: white; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #0062cc; }
        .alert-error { background: #ffe5e5; color: #d32f2f; padding: 10px; border-radius: 10px; font-size: 0.9rem; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon-circle"><i class="bi bi-shield-lock-fill"></i></div>
        <h1>Bienvenido</h1>
        <p>Introduce tus credenciales de administrador</p>
        {% if error %}
        <div class="alert-error"><i class="bi bi-exclamation-triangle-fill"></i> {{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="form-group"><label>Usuario</label><input type="text" name="username" placeholder="admin" required autofocus></div>
            <div class="form-group"><label>Contraseña</label><input type="password" name="password" placeholder="••••••••" required></div>
            <button type="submit">Iniciar Sesión</button>
        </form>
        <div style="margin-top: 30px; font-size: 0.7rem; color: #C7C7CC;">System v2.4 &bull; Madrid Node</div>
    </div>
</body>
</html>
