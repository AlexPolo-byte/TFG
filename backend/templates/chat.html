<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Chat Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F2F2F7;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: white;
            padding: 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .btn-back {
            text-decoration: none;
            color: #007AFF;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .msg-bot {
            align-self: flex-start;
            background: white;
            border-bottom-left-radius: 4px;
            color: #000;
        }

        .msg-user {
            align-self: flex-end;
            background: #007AFF;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            background: white;
            padding: 10px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ddd;
            outline: none;
        }

        button {
            background: #007AFF;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="chat-header">
        <a href="/" class="btn-back"><i class="bi bi-chevron-left"></i> Volver</a>
        <span style="font-weight: bold;">Chat con IA</span>
        <div style="width: 20px;"></div>
    </div>

    <div class="chat-area" id="box">
        <div class="msg msg-bot">¡Ey! 👋 Soy Alex, tu colega de tecnología. Pregúntame lo que quieras sobre ordenadores,
            apps, internet... ¡lo que sea tech! 💻🚀</div>
    </div>

    <div class="input-area">
        <input type="text" id="in" placeholder="Escribir mensaje..." autocomplete="off">
        <button onclick="s()"><i class="bi bi-send-fill"></i></button>
    </div>

    <script>
        // Tu lógica JS original
        let sid = localStorage.getItem('sid'); if (!sid) { sid = 'adm_' + Date.now(); localStorage.setItem('sid', sid); }
        let last = Date.now() / 1000;

        function add(t, u) {
            const d = document.createElement('div');
            d.className = u ? 'msg msg-user' : 'msg msg-bot';
            d.textContent = t;
            document.getElementById('box').appendChild(d);
            document.getElementById('box').scrollTop = 99999;
        }

        function s() {
            const t = document.getElementById('in').value.trim();
            if (!t) return;
            add(t, true);
            document.getElementById('in').value = '';
            fetch('/api/web/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: t, session_id: sid, username: 'Admin' })
            }).catch(() => { });
        }
        document.getElementById('in').addEventListener('keypress', e => { if (e.key === 'Enter') s() });

        setInterval(() => {
            fetch(`/api/web/poll?session_id=${sid}&last_check=${last}`).then(r => r.json()).then(d => {
                if (d.messages && d.messages.length > 0) {
                    d.messages.forEach(u => { add(u.text, false); last = Math.max(last, u.timestamp); });
                }
            }).catch(() => { });
        }, 1000);
    </script>
</body>

</html>
